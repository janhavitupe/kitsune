[project]
name = "kitsune-cli"
version = "0.1.0"
description = "Version control for artwork from the terminal, next to any paint app"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
kitsune = "kitsune_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kitsune_cli"]
